
name: Android Release APK qurish

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Tekshiruv
        uses: actions/checkout@v4

      - name: JDK 21 ni sozlash
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
      uses: android-actions/setup-android@v4
      with:
        packages: 'platform-tools'

      - name: Install Android API 36
      run: |
        sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Ruxsat berish
        run: chmod +x gradlew

      - name: APK yig‘ish
        run: ./gradlew --no-daemon clean assembleRelease

      - name: Keystoreni dekodlash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > release-key.jks

      - name: APKni imzolash
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          BUILD_TOOLS=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner"
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)

          "$APKSIGNER" sign \
            --ks release-key.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:STORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out app-release-signed.apk \
            "$APK"

          "$APKSIGNER" verify --verbose app-release-signed.apk

      - name: Tayyor APKni yuklash
        uses: actions/upload-artifact@v4
        with:
          name: GalleryFeed-Release
          path: app-release-signed.apk

      - name: Github Releasega yuklash
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app-release-signed.apk
