name: Android Release APK qurish

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repositoryni yuklash
        uses: actions/checkout@v4

      - name: JDK 21 ni sozlash
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Android SDK ni sozlash
        uses: android-actions/setup-android@v4

      - name: Android API 36 ni o‘rnatish
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Gradle ruxsatini berish
        run: chmod +x gradlew

      - name: APK yig‘ish
        run: ./gradlew --no-daemon clean assembleRelease

      - name: Keystoreni dekodlash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > release-key.jks

      - name: APKni imzolash
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          BUILD_TOOLS="36.0.0"
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner"

          APK=$(find app/build/outputs/apk/release \
            -name '*.apk' | head -n 1)

          test -n "$APK"

          "$APKSIGNER" sign \
            --ks release-key.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:STORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out app-release-signed.apk \
            "$APK"

          "$APKSIGNER" verify --verbose app-release-signed.apk

      - name: Keystoreni o‘chirish
        if: always()
        run: rm -f release-key.jks

      - name: APK artifact sifatida yuklash
        uses: actions/upload-artifact@v4
        with:
          name: GalleryFeed-Release
          path: app-release-signed.apk

      - name: GitHub Release yaratish
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app-release-signed.apk